[project]
name = "polynomial-spectrum-estimation"
version = "0.1.0"
description = "SDP bounds on convex roofs of entanglement-spectrum polynomials"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "qics", "schur-weyl>=0.3.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
